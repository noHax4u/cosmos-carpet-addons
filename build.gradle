plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// stolen from carpet TIS
	maven {
		url = 'https://masa.dy.fi/maven'
		content { includeModule('carpet', 'fabric-carpet') }
	}
	// Axiom (optional integration, compile only)
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup('maven.modrinth') }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cosmos-carpet-addons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/cosmos-carpet-addons.classtweaker")

	runs {
		configureEach {
			// Fabric has no load order setting and shuffles mods in dev; load this mod last in dev runs
			vmArg "-Dfabric.debug.loadLate=cosmos-carpet-addons"
		}
	}
}

configurations {
	// only used to extract Axiom's nested API jar for compilation
	axiom { transitive = false }
}

// Axiom's classes reference its client API, which is bundled inside the Axiom jar (jar-in-jar)
def extractAxiomApi = tasks.register("extractAxiomApi", Sync) {
	def axiomJar = configurations.axiom
	from({ axiomJar.collect { zipTree(it) } }) {
		include "META-INF/jars/axiomclientapi*.jar"
		eachFile { it.path = it.name }
	}
	includeEmptyDirs = false
	into layout.buildDirectory.dir("axiom-api")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// carpet
	implementation "carpet:fabric-carpet:${project.fabric_carpet_version}"

	// Axiom: optional, never bundled. Its mixins are only applied when Axiom is installed.
	compileOnly "maven.modrinth:axiom:${project.axiom_version}"
	axiom "maven.modrinth:axiom:${project.axiom_version}"
	compileOnly files(layout.buildDirectory.file("axiom-api/axiomclientapi-unobf.jar")).builtBy(extractAxiomApi)
}

// Dev runs with Axiom: ./gradlew installAxiomDev, then runClient / runServer as usual; ./gradlew removeAxiomDev undoes it.
// (Fabric Loader rejects Axiom on the dev classpath, so it goes into run/mods like a normal install.)
tasks.register("installAxiomDev", Copy) {
	from configurations.axiom
	into file("run/mods")
}
tasks.register("removeAxiomDev", Delete) {
	delete fileTree("run/mods") { include "axiom-*.jar", "Axiom-*.jar" }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
