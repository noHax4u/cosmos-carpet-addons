# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create releases
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      # Pushing a tag creates a draft release with the built jars attached.
      # Edit the description on GitHub, then publish it.
      - name: create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --draft --generate-notes
      # Pushing a tag also creates a draft version on Modrinth with the mod jar (not the sources jar).
      # Needs the repository secret MODRINTH_TOKEN (PAT with "Create versions") and the
      # repository variable MODRINTH_PROJECT_ID.
      - name: find mod jar
        id: mod
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          jars=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar')
          if [ "$(echo "$jars" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one mod jar in build/libs, found: $jars" >&2
            exit 1
          fi
          echo "jar=$jars" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: create draft Modrinth version
        if: startsWith(github.ref, 'refs/tags/')
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          version: ${{ github.ref_name }}
          status: draft
          loaders: fabric
          game-versions: ${{ steps.mod.outputs.minecraft }}
          files: ${{ steps.mod.outputs.jar }}
          dependencies: |-
            [
              {"project_id": "P7dR8mSH", "dependency_type": "required"},
              {"project_id": "TQTTVgYE", "dependency_type": "required"},
              {"project_id": "N6n5dqoA", "dependency_type": "optional"}
            ]
